version = "0.6.2"
content_dir = "content"

# `template.typ` is a library, not a page — every other `.typ` under
# `content/` is a vertebra, so without this it would compile to its own
# `template.html`. The global `[spine]` table applies to every format.
[spine]
exclude = ["template.typ"]

[[html.assets]]
css_stylesheet = "./style.css"

[[html.assets]]
js_scripts = "./nav.js"

[[html.assets]]
js_scripts = "./tables.js"

[pdf.spine]
title = "Rookery"

[epub.spine]
title = "Rookery"

# `@rookery` is its own repository and namespace, so nothing resolves it by
# default — rheo has to be told where it comes from.
#
# THE BRANCH, not a release: the 0.1.0 family has not merged yet, and a
# repository ref is consumable as it stands, so there is nothing to publish
# first and every push is picked up on the next build. rheo keys its cache by
# the resolved commit, so a moved branch is a natural miss rather than a stale
# hit.
[packages.rookery]
repo = "https://github.com/freecomputinglab/rookery"
branch = "0.1.0"
